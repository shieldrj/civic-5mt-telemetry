org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

# AndroidX, which every dependency in the app module is. Required by AGP rather than optional.
android.useAndroidX=true
# Non-transitive R classes: each module gets only its own resources, so a stray reference to
# another module's resource fails at compile time instead of resolving by accident.
android.nonTransitiveRClass=true
