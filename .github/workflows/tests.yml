name: Tests

# Telemetry engine tests and Android build checks on every push and pull request.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # Pure JVM physics and telemetry model tests.
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run Core Physics & Telemetry Tests
        run: ./gradlew --no-daemon :core:test

  # Android module compilation and unit tests.
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-app-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-app-${{ runner.os }}-

      - name: Build Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Run Android Unit Tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

