name: Tests

# The telemetry engine's test suite, on every push and pull request.
#
# deploy.yml already runs `npm run build`, which type-checks the app - but tsconfig excludes
# src/tests, and nothing was running the assertions themselves. So a change that broke the
# fuel model or a PID formula would deploy green, and only show up as a wrong number on a
# gauge in the car. That is the failure mode this whole suite exists to catch.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Catches type errors in src/, which tsconfig covers, before the assertions run.
      - name: Type-check
        run: npx tsc --noEmit

      - name: Telemetry engine tests
        run: npm test

  # The native port's copy of the same specification. Runs alongside the TypeScript rather
  # than replacing it: while both implementations exist the whole point is that they agree,
  # and a suite that only started running once the TypeScript was deleted would prove that
  # too late to be useful.
  native-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app-native/**/*.gradle.kts', 'app-native/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Straight to gradlew, not app-native/build.sh - that script exists to work around
      # OneDrive turning files into reparse points on the development machine, which is not
      # a problem a Linux runner has.
      - name: Physics model tests
        working-directory: app-native
        run: ./gradlew --no-daemon :core:test

  # Compiles the Android module. It has no unit tests of its own by design - everything with
  # logic in it lives in :core, which is plain JVM - so what this catches is the build
  # breaking, which otherwise would not surface until someone tried to put a build on the
  # phone. The APK is not kept; this is a check, not a release.
  native-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-app-${{ runner.os }}-${{ hashFiles('app-native/**/*.gradle.kts', 'app-native/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-app-${{ runner.os }}-

      - name: Build debug APK
        working-directory: app-native
        run: ./gradlew --no-daemon :app:assembleDebug
