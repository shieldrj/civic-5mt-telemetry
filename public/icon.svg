<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1118"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b5c"/>
      <stop offset="100%" stop-color="#d61c2f"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#222736" stroke-width="12"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#redGlow)" stroke-width="12" stroke-dasharray="989" stroke-dashoffset="330" stroke-linecap="round" transform="rotate(135 256 256)"/>
  <!-- Tachometer needle -->
  <line x1="256" y1="256" x2="380" y2="170" stroke="url(#redGlow)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="24" fill="#141722" stroke="#ff2e43" stroke-width="6"/>
  <!-- Gear badge -->
  <rect x="216" y="320" width="80" height="70" rx="16" fill="#181c28" stroke="#384055" stroke-width="4"/>
  <text x="256" y="370" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" text-anchor="middle">5M</text>
  <!-- Brand text -->
  <text x="256" y="140" fill="#8892b0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="4" text-anchor="middle">CIVIC 5MT</text>
</svg>
